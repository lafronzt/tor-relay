# Required: build image/Dockerfile, push it, then supply the resulting digest.
image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
relay:
  nickname: TorMiddleRelay
  # Public IPv4 advertised in the descriptor; never use a pod/node private address.
  publicIPv4: ""
  # Published in the directory. Supply a working contact you are willing to publish.
  contactInfo: ""
  bandwidthRate: "2 MB"
  bandwidthBurst: "4 MB"
  accounting:
    enabled: false
    max: "1 TB"
    start: "month 1 00:00"
    rule: sum
storage:
  # Required. Verify the cluster first; often microk8s-hostpath on MicroK8s.
  className: ""
  size: 1Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 32Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 128Mi
# Optional kubernetes.io/hostname selector after verifying the node.
nodeSelector: {}
networkPolicy:
  enabled: true
