apiVersion: v1
kind: Service
metadata:
  name: tor-relay
  namespace: tor-relay
  labels:
    {{- include "tor-relay.labels" . | nindent 4 }}
spec:
  type: NodePort
  # Default Cluster policy tolerates single-node CNI/proxy routing differences.
  # CountPrivateBandwidth accounts for SNAT; no client source IP is required.
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  selector:
    app.kubernetes.io/name: tor-relay
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: orport
      protocol: TCP
      port: 9001
      targetPort: orport
      nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: tor-relay-headless
  namespace: tor-relay
  labels:
    {{- include "tor-relay.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tor-relay
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: orport
      port: 9001
      targetPort: orport
      protocol: TCP
