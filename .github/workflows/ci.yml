name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.19.0, v4.3.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Helm with checksum verification
        env:
          HELM_VERSION: ${{ matrix.helm }}
        run: |
          set -euo pipefail
          name="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/$name"
          curl -fsSLo "$name.sha256sum" "https://get.helm.sh/$name.sha256sum"
          sha256sum -c "$name.sha256sum"
          tar -xzf "$name" linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 "$name" "$name.sha256sum"
      - name: Local checks
        run: ./scripts/validate-local.sh
      - name: Audit source archive
        run: python3 scripts/package-release.py --output /tmp/tor-relay-source.tar.gz
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm with checksum verification
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; *) exit 1;; esac
          name="helm-v4.3.1-linux-$arch.tar.gz"
          curl -fsSLO "https://get.helm.sh/$name"
          curl -fsSLo "$name.sha256sum" "https://get.helm.sh/$name.sha256sum"
          sha256sum -c "$name.sha256sum"
          tar -xzf "$name" "linux-$arch/helm"
          sudo install "linux-$arch/helm" /usr/local/bin/helm
          rm -rf "linux-$arch" "$name" "$name.sha256sum"
      - name: Build pinned Tor package
        run: docker build --pull --no-cache -f image/Dockerfile -t tor-relay:test .
      - name: Test without network or published ports
        run: ./scripts/test-container.sh tor-relay:test
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks with checksum verification
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v$version"
          name="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "$base/$name"
          curl -fsSLO "$base/gitleaks_${version}_checksums.txt"
          grep " $name\$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$name" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "$name" "gitleaks_${version}_checksums.txt"
      - name: Scan all Git history
        run: gitleaks git . --redact --no-banner --log-opts="--all"
